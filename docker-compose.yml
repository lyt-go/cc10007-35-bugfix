services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      # 告警归因明细数据集的落库目标；联调环境改成共享库地址即可，无需改代码。
      - DATABASE_URL=sqlite:////srv/app/var/incident_store.sqlite3
      - STORAGE_TARGET=联调环境数据库
    volumes:
      - incident_store:/srv/app/var
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  incident_store:
